# AI Gateway do helpdesk (LiteLLM Proxy). Decisões: docs/adr/0003-ai-gateway.md,
# docs/adr/0004-logical-capabilities.md, 0005-resilience-policy.md e 0006-fallback-policy.md.
#
# model_name   = grupo de modelos. Os quatro nomes sem sufixo são as capacidades lógicas que
#                a app pede. Os nomes "<capacidade>-equivalent" e "<capacidade>-degraded" são
#                destinos INTERNOS da cadeia de fallback: a app nunca os pede (ADR 0006).
# litellm_params.model = "<provider>/<modelo físico>": o prefixo escolhe o tradutor
#                (openai = Chat Completions; anthropic = Messages).
# api_base     = endereço do provider DENTRO da rede do compose.
# api_key      = lida do ambiente do container do gateway (os.environ/...), nunca escrita aqui.
#
# Um único destino (deployment) por grupo: sem balanceamento de carga, o primário nunca é
# trocado por sorteio. A ordem de recuperação está em router_settings.fallbacks.
#
# Governança (Passo 12, ADRs 0007 a 0010): o PREÇO de cada modelo físico está no seu destino
# (input/output_cost_per_token, US$ por token, da tabela do provider-fake/README.md), então o
# custo é o do modelo que de fato respondeu, inclusive num fallback. Orçamento, RPM e quais
# capacidades cada chave pode pedir ficam nas CHAVES VIRTUAIS, guardadas no Postgres do
# gateway e criadas por gateway/scripts/bootstrap_keys.py; nada disso fica neste arquivo.

model_list:
  # ---------------- F1: ticket-classification ----------------
  - model_name: ticket-classification          # primário
    litellm_params:
      model: openai/gpt-fake-large
      input_cost_per_token: 0.0000025   # US$ 2,50 / 10,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.00001
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 3                               # por tentativa; normal ~1,1 s

  - model_name: ticket-classification-equivalent   # fallback técnico: large de OUTRO provider
    litellm_params:
      model: anthropic/claude-fake-large
      input_cost_per_token: 0.000003    # US$ 3,00 / 15,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.000015
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 3
      max_tokens: 2000

  - model_name: ticket-classification-degraded     # modelo inferior APROVADO (ADR 0006, F1)
    litellm_params:
      model: openai/gpt-fake-mini
      input_cost_per_token: 0.00000015  # US$ 0,15 / 0,60 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.0000006
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 2                               # normal ~0,4 s

  # ---------------- F4: order-extraction (sem modelo inferior) ----------------
  - model_name: order-extraction               # primário
    litellm_params:
      model: openai/gpt-fake-large
      input_cost_per_token: 0.0000025   # US$ 2,50 / 10,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.00001
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 3                               # por tentativa; normal ~1,2 s

  - model_name: order-extraction-equivalent    # fallback técnico
    litellm_params:
      model: anthropic/claude-fake-large
      input_cost_per_token: 0.000003    # US$ 3,00 / 15,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.000015
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 3
      max_tokens: 2000

  # ---------------- F2: reply-suggestion ----------------
  - model_name: reply-suggestion               # primário
    litellm_params:
      model: anthropic/claude-fake-large
      input_cost_per_token: 0.000003    # US$ 3,00 / 15,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.000015
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 20                              # por tentativa; normal até ~16,2 s
      max_tokens: 2000                         # mesmo limite que a v1 envia

  - model_name: reply-suggestion-equivalent    # fallback técnico
    litellm_params:
      model: openai/gpt-fake-large
      input_cost_per_token: 0.0000025   # US$ 2,50 / 10,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.00001
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 20
      max_tokens: 2000

  - model_name: reply-suggestion-degraded      # modelo inferior APROVADO (ADR 0006, F2)
    litellm_params:
      model: anthropic/claude-fake-mini
      input_cost_per_token: 0.0000008   # US$ 0,80 / 4,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.000004
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 5                               # normal ~2,1 s
      max_tokens: 2000

  # ---------------- F3: topics-report (por lote; sem modelo inferior) ----------------
  - model_name: topics-report                  # primário
    litellm_params:
      model: anthropic/claude-fake-large
      input_cost_per_token: 0.000003    # US$ 3,00 / 15,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.000015
      api_base: http://provider-fake:8090/anthropic
      api_key: os.environ/FAKE_ANTHROPIC_KEY
      timeout: 12                              # por tentativa (um lote); normal até ~9,9 s
      max_tokens: 2000

  - model_name: topics-report-equivalent       # fallback técnico
    litellm_params:
      model: openai/gpt-fake-large
      input_cost_per_token: 0.0000025   # US$ 2,50 / 10,00 por 1M (provider-fake/README.md)
      output_cost_per_token: 0.00001
      api_base: http://provider-fake:8090/openai/v1
      api_key: os.environ/FAKE_OPENAI_KEY
      timeout: 12
      max_tokens: 2000

# Retentativas, backoff e fallback (ADR 0005 revisado e ADR 0006). O gateway é o ÚNICO dono:
# o SDK da app usa max_retries=0 e o LiteLLM zera o do SDK do provider nas chamadas do router.
# Backoff do LiteLLM v1.102.1 (não configurável por grupo): 0,5 s x 2^n + jitter de 0 a
# 0,75 s, com uma pausa também depois da última tentativa. Um destino com 0 retentativas
# falha na hora, sem pausa, e a cadeia segue para o próximo destino.
router_settings:
  num_retries: 1                     # padrão para erros fora da política (ex.: conexão recusada)
  disable_cooldowns: true            # sem tirar destino de rotação (circuit breaker fora do escopo)
  max_fallbacks: 2                   # teto de saltos por requisição (a maior cadeia tem 2)

  # Ordem de recuperação: primário -> equivalente large de outro provider -> mini, SÓ nas
  # capacidades em que o produto aceitou degradação (F1 e F2). F3 e F4 terminam no large.
  # Lista finita e sem volta: o LiteLLM também pula destino já tentado na mesma requisição.
  fallbacks:
    - ticket-classification: [ticket-classification-equivalent, ticket-classification-degraded]
    - order-extraction: [order-extraction-equivalent]
    - reply-suggestion: [reply-suggestion-equivalent, reply-suggestion-degraded]
    - topics-report: [topics-report-equivalent]

  # Entrada maior que o contexto (400): o outro large tem o mesmo limite, então trocar de
  # destino só gastaria uma chamada. Lista vazia = não há fallback para esse erro.
  context_window_fallbacks:
    - ticket-classification: []
    - order-extraction: []
    - reply-suggestion: []
    - topics-report: []

  model_group_retry_policy:
    # Primário: repete UMA vez falha imediata possivelmente transitória (500/503). Timeout e 429
    # não repetem no mesmo destino: com um equivalente disponível, migrar é mais rápido e cabe
    # no prazo. 400/401/política de conteúdo não repetem.
    ticket-classification: &primario
      TimeoutErrorRetries: 0
      RateLimitErrorRetries: 0
      InternalServerErrorRetries: 1
      ServiceUnavailableErrorRetries: 1
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    order-extraction: *primario
    reply-suggestion: *primario
    topics-report: *primario
    # Destinos de fallback: uma única tentativa, qualquer que seja o erro.
    ticket-classification-equivalent: &unica
      DefaultRetries: 0
      TimeoutErrorRetries: 0
      RateLimitErrorRetries: 0
      InternalServerErrorRetries: 0
      ServiceUnavailableErrorRetries: 0
      BadRequestErrorRetries: 0
      AuthenticationErrorRetries: 0
      ContentPolicyViolationErrorRetries: 0
    order-extraction-equivalent: *unica
    reply-suggestion-equivalent: *unica
    topics-report-equivalent: *unica
    ticket-classification-degraded: *unica
    reply-suggestion-degraded: *unica

general_settings:
  # Master key: só administração (criar, alterar, revogar chaves). Consumo usa chave virtual.
  # Com DATABASE_URL no ambiente (compose), o gateway aceita as chaves virtuais do banco.
  # enforce_fallback_model_access fica no padrão (falso): a chave da app só lista as 4
  # capacidades, mas o gateway ainda pode usar os grupos internos da cadeia de fallback.
  master_key: os.environ/GATEWAY_MASTER_KEY
