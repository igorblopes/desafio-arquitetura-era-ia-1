services:
  provider-fake:
    build: ./provider-fake
    environment:
      # Só as chaves que o provider-fake valida (sem env_file), interpoladas do .env.
      FAKE_OPENAI_KEY: ${FAKE_OPENAI_KEY:?defina FAKE_OPENAI_KEY no .env}
      FAKE_ANTHROPIC_KEY: ${FAKE_ANTHROPIC_KEY:?defina FAKE_ANTHROPIC_KEY no .env}
    ports:
      - "8090:8090"

  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app:
    build: ./app
    environment:
      # Só o endereço do gateway e a chave VIRTUAL de consumo do helpdesk (ADR 0010):
      # nenhuma chave de provider, nenhuma master key, nenhuma senha de banco.
      GATEWAY_URL: http://gateway:4000
      GATEWAY_API_KEY: ${HELPDESK_GATEWAY_KEY:?defina HELPDESK_GATEWAY_KEY no .env}
    volumes:
      - ./data:/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 2s
      timeout: 3s
      retries: 20
    depends_on:
      gateway:
        condition: service_healthy
      # A app só sobe depois que a chave dela existe no gateway (ADR 0008).
      gateway-bootstrap:
        condition: service_completed_successfully

  # AI Gateway (LiteLLM Proxy). ADR 0003. Todas as features da app passam por ele;
  # só ele conhece os providers e as chaves deles.
  gateway:
    image: ghcr.io/berriai/litellm:v1.102.1
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      # Só o que o gateway usa, declarado um a um (sem env_file): chaves dos providers
      # e a chave própria do gateway. Os valores vêm do .env por interpolação.
      FAKE_OPENAI_KEY: ${FAKE_OPENAI_KEY:?defina FAKE_OPENAI_KEY no .env}
      FAKE_ANTHROPIC_KEY: ${FAKE_ANTHROPIC_KEY:?defina FAKE_ANTHROPIC_KEY no .env}
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?defina GATEWAY_MASTER_KEY no .env}
      # Banco de governança (ADR 0007): chaves virtuais, orçamentos e gasto por chave.
      DATABASE_URL: postgresql://litellm:${GATEWAY_DB_PASSWORD:?defina GATEWAY_DB_PASSWORD no .env}@gateway-db:5432/litellm
      # Usa a tabela de modelos embutida na imagem, sem buscá-la na internet ao subir.
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
    volumes:
      - ./gateway/config.yaml:/app/config.yaml:ro
    ports:
      - "4000:4000"   # só para testes no host; a app usa http://gateway:4000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/readiness')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    depends_on:
      provider-fake:
        condition: service_healthy
      gateway-db:
        condition: service_healthy

  # Banco de governança do gateway (ADR 0007). Só o gateway o acessa: a app não recebe a
  # senha nem a URL. Sem porta publicada no host; dados num volume nomeado.
  gateway-db:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${GATEWAY_DB_PASSWORD:?defina GATEWAY_DB_PASSWORD no .env}
    volumes:
      - gateway-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Provisionamento das chaves virtuais (ADR 0008): roda uma vez a cada `up`, cria o que
  # falta, alinha as políticas e termina. Idempotente: nunca recria chave nem zera gasto.
  # Reusa a imagem do gateway (já tem Python); só ele recebe a master key além do gateway.
  gateway-bootstrap:
    image: ghcr.io/berriai/litellm:v1.102.1
    entrypoint: ["python", "/scripts/bootstrap_keys.py"]
    environment:
      GATEWAY_URL: http://gateway:4000
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:?defina GATEWAY_MASTER_KEY no .env}
      HELPDESK_GATEWAY_KEY: ${HELPDESK_GATEWAY_KEY:?defina HELPDESK_GATEWAY_KEY no .env}
      GOVERNANCE_BUDGET_KEY: ${GOVERNANCE_BUDGET_KEY:?defina GOVERNANCE_BUDGET_KEY no .env}
      GOVERNANCE_RATE_KEY: ${GOVERNANCE_RATE_KEY:?defina GOVERNANCE_RATE_KEY no .env}
    volumes:
      - ./gateway/scripts:/scripts:ro
    restart: "no"
    depends_on:
      gateway:
        condition: service_healthy

volumes:
  gateway-db-data:
